<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/voys_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voys</title>
    <meta name="application-name" content="Voys" />
    <meta name="apple-mobile-web-app-title" content="Voys" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-transparent text-[#c6d4df] select-none overflow-hidden antialiased font-sans">
    <div id="root"></div>
    <script>
      // Global context menu handler: Suppresses default browser/WebView context menu (Geri, Yenile, Yazdır...)
      // Keeps inputs/textareas editable and allows custom app context menus
      window.addEventListener('contextmenu', function (e) {
        var target = e.target;
        var isEditable = target && (
          target.tagName === 'INPUT' ||
          target.tagName === 'TEXTAREA' ||
          target.isContentEditable ||
          (target.closest && target.closest('input, textarea, [contenteditable="true"]'))
        );
        if (!isEditable) {
          e.preventDefault();
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
